<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário Cadastro - Estilo Livre</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="./assets/icon/fav-icon.png" type="image/png" />
</head>
<body class="formulario__body">
  <main class="formulario-cadastro">
    <h1>Cadastro</h1>
    <form class="cadastro__form">
      <label for="cpf">CPF:</label>
      <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF"/>

      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(99) 99999-9999" />

      <label for="cep">CEP:</label>
      <input type="text" id="cep" name="cep" placeholder="Digite seu CEP" />

      <div class="termos">
        <input type="checkbox" id="termos" name="termos" required />
        <label for="termos">Concordo com os <a href="#">termos de uso</a> e <a href="#">política de privacidade</a>.</label>
      </div>

      <button type="submit">Clique aqui para se cadastrar</button>
    </form>
  </main>
</body>
</html>
